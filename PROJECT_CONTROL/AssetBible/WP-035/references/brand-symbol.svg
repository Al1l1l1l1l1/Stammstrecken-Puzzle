<!-- Stammstrecken-Puzzle — Brand symbol construction reference.
     Design recommendation awaiting explicit product and legal approval.
     96-unit square; two 8-unit routes stop at (48,60) and (60,48).
     Their 16.971-unit centre-to-centre diagonal separation remains visibly open. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Unterbrochener Gleisknoten</title>
  <desc id="desc">Zwei rechtwinklig geführte Strecken verfehlen sich knapp an einem offenen diagonalen Knoten.</desc>
  <g id="symbol" fill="none" stroke="#20272C" stroke-width="8" stroke-linecap="square" stroke-linejoin="round">
    <path id="route-southwest" d="M 12,84 H 32 C 40.837,84 48,76.837 48,68 V 60"/>
    <path id="route-northeast" d="M 84,12 V 32 C 84,40.837 76.837,48 68,48 H 60"/>
  </g>
</svg>
