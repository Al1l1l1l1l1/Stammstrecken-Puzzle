# Unity CI (WP-008; CI-Readiness-Haertung vor WP-021)
#
# Unity-Nachweis-Workflow fuer das Produktionsscaffold gemäß
# ARCHITECTURE/BUILD_AND_RELEASE.md Abschnitt 5 und 6 sowie
# ARCHITECTURE/TEST_STRATEGY.md Abschnitt 11.
#
# - project-preflight laeuft immer: autoritative Unity-Versionspin-Pruefung,
#   statischer Modulgraph-Check der realen .asmdef-Dateien gegen die normativen
#   Allowlists aus ARCHITECTURE/MODULE_BOUNDARIES.md Abschnitt 3 (Produktion)
#   und Abschnitt 4 (Tests) sowie Skelett-Konventionspruefungen. Das ist ein
#   echter, ausgefuehrter Check.
# - unity-environment-linux/-android/-ios laufen immer und ohne Secrets: Sie
#   weisen die Runnerbereitschaft ausgefuehrt nach (Editor-Headless-Start bis
#   zur erwarteten Lizenzpruefung, Android-Toolchain-Pfade, Xcode-26+-Auswahl
#   mit iOS-SDK). Sie behaupten keinen Compile-, Test- oder Buildnachweis.
# - Die lizenzpflichtigen Unity-Jobs (Compile, EditMode,
#   Bootstrap-PlayMode-Smoke, Android-Development-IL2CPP, iOS-Export/Compile)
#   laufen erst, wenn Unity-Lizenz und reproduzierbare Runner konfiguriert sind
#   (secrets.UNITY_LICENSE und vars.UNITY_RUNNERS_READY = "true"). Ohne diese
#   Konfiguration schlaegt der unity-evidence-guard fail-closed fehl und meldet
#   den Befund NOT_EXECUTED/BLOCKED wahrheitsgemaess; kein Job tauscht einen
#   erfolgreichen Unity-Nachweis vor.
# - Runnerbilder gemaess BUILD_AND_RELEASE.md Abschnitt 6 ("Container oder
#   reproduzierbares Runnerimage"): Linux/Android laufen in per Tag und Digest
#   gepinnten unityci/editor-Containern der exakten Editorversion
#   (6000.3.23f1; unityci-Release 3.2.2); iOS laeuft auf macos-15 mit per
#   Changeset 09d2ecc7fb28 gepinntem Unity-Hub-Install und expliziter
#   Xcode-26+-Auswahl. Die Container enthalten unity-editor auf PATH sowie
#   (android-Variante) das Unity-gebuendelte Android-SDK/NDK/OpenJDK.
# - Alle Actions sind per vollstaendigem Commit-SHA gepinnt; Permissions folgen
#   Least Privilege (contents: read). Keine Secrets im Repository.

name: Unity CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  STP_UNITY_VERSION: 6000.3.23f1
  STP_UNITY_CHANGESET: 09d2ecc7fb28

jobs:
  project-preflight:
    name: project-preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Repository mit vollständiger Historie auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: CPython 3.11.13 einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.13"

      - name: Unity-Versionspin und Projektartefakte prüfen
        run: |
          set -euo pipefail
          grep -q "^m_EditorVersion: ${STP_UNITY_VERSION}$" ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -f Packages/packages-lock.json
          test -f Toolchain.lock.md
          test -f Assets/StammstreckenPuzzle/Scenes/QA/BootstrapComposition.unity
          test -f Assets/StammstreckenPuzzle/Scenes/QA/BootstrapComposition.unity.meta
          echo "Unity-Versionspin ${STP_UNITY_VERSION} und Pflichtartefakte vorhanden."

      - name: Statischer Modulgraph-Check der realen .asmdef-Dateien
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys

          root = pathlib.Path(".")
          # Spiegel der einzigen normativen Allowlists aus
          # ARCHITECTURE/MODULE_BOUNDARIES.md Abschnitt 3 (Produktion) und
          # Abschnitt 4 (Testassemblies), Stand Architecture v1.0.
          expected = {
              "STP.Puzzle.Domain": set(),
              "STP.Puzzle.Solver": {"STP.Puzzle.Domain"},
              "STP.Application": {"STP.Puzzle.Domain", "STP.Puzzle.Solver"},
              "STP.Infrastructure.Content": {"STP.Application", "STP.Puzzle.Domain"},
              "STP.Infrastructure.Persistence": {"STP.Application", "STP.Puzzle.Domain"},
              "STP.MobileServices.Google": {"STP.Application"},
              "STP.MobileServices.Store": {"STP.Application"},
              "STP.Platform": {"STP.Application"},
              "STP.Audio": {"STP.Application"},
              "STP.Presentation.UI": {"STP.Application", "STP.Puzzle.Domain"},
              "STP.Presentation.World": {"STP.Application", "STP.Puzzle.Domain"},
              "STP.Bootstrap": {
                  "STP.Application", "STP.Infrastructure.Content", "STP.Infrastructure.Persistence",
                  "STP.MobileServices.Google", "STP.MobileServices.Store", "STP.Platform",
                  "STP.Audio", "STP.Presentation.UI", "STP.Presentation.World",
              },
              "STP.Editor.Content": {"STP.Puzzle.Domain", "STP.Puzzle.Solver", "STP.Infrastructure.Content"},
              "STP.Editor.Build": {"STP.Bootstrap"},
          }
          # Interne Referenzen der neun Testassemblies (Abschnitt 4); die
          # Unity-Testrunner-Referenzen werden separat geprueft.
          test_expected = {
              "STP.Tests.Domain.EditMode": {"STP.Puzzle.Domain"},
              "STP.Tests.Solver.EditMode": {"STP.Puzzle.Domain", "STP.Puzzle.Solver"},
              "STP.Tests.Application.EditMode": {"STP.Application"},
              "STP.Tests.Persistence.EditMode": {"STP.Infrastructure.Persistence"},
              "STP.Tests.Content.EditMode": {"STP.Infrastructure.Content", "STP.Puzzle.Domain", "STP.Puzzle.Solver", "STP.Editor.Content"},
              "STP.Tests.Presentation.PlayMode": {"STP.Presentation.UI", "STP.Presentation.World"},
              "STP.Tests.Mobile.PlayMode": {"STP.MobileServices.Google", "STP.MobileServices.Store"},
              "STP.Tests.Bootstrap.PlayMode": {
                  "STP.Bootstrap", "STP.Application", "STP.Infrastructure.Content", "STP.Infrastructure.Persistence",
                  "STP.MobileServices.Google", "STP.MobileServices.Store", "STP.Platform",
                  "STP.Audio", "STP.Presentation.UI", "STP.Presentation.World",
              },
              "STP.Tests.Device": {"STP.MobileServices.Google", "STP.MobileServices.Store", "STP.Platform"},
          }
          pure = {"STP.Puzzle.Domain", "STP.Puzzle.Solver", "STP.Application"}
          editors = {"STP.Editor.Content", "STP.Editor.Build"}
          editmode_tests = {name for name in test_expected if name.endswith(".EditMode")}
          test_runner_refs = {"UnityEngine.TestRunner", "UnityEditor.TestRunner"}

          errors = []
          found = {}
          for asmdef in sorted(root.glob("Assets/**/*.asmdef")):
              data = json.loads(asmdef.read_text(encoding="utf-8"))
              name = data.get("name")
              if name in found:
                  errors.append(f"duplicate-assembly:{name}")
              found[name] = (asmdef, data)

          all_expected = set(expected) | set(test_expected)
          if set(found) != all_expected:
              errors.append(f"assembly-set: fehlen={sorted(all_expected - set(found))} unbekannt={sorted(set(found) - all_expected)}")

          for name, (path, data) in sorted(found.items()):
              refs = set(data.get("references", []))
              if name in expected:
                  if refs != expected[name]:
                      errors.append(f"references:{name}: erwartet={sorted(expected[name])} tatsaechlich={sorted(refs)}")
              elif name in test_expected:
                  internal = refs - test_runner_refs
                  if internal != test_expected[name]:
                      errors.append(f"test-references:{name}: erwartet={sorted(test_expected[name])} tatsaechlich={sorted(internal)}")
                  if not test_runner_refs.issubset(refs):
                      errors.append(f"test-runner-references:{name}")
                  if data.get("overrideReferences") is not True:
                      errors.append(f"test-override-references:{name}")
                  if "nunit.framework.dll" not in data.get("precompiledReferences", []):
                      errors.append(f"test-nunit-reference:{name}")
                  if "UNITY_INCLUDE_TESTS" not in data.get("defineConstraints", []):
                      errors.append(f"test-define-constraint:{name}")
                  if data.get("autoReferenced") is not False:
                      errors.append(f"test-auto-referenced:{name}")
              if name in pure and data.get("noEngineReferences") is not True:
                  errors.append(f"no-engine-references:{name}")
              if name not in pure and data.get("noEngineReferences") is True:
                  errors.append(f"unexpected-no-engine-references:{name}")
              if name in editors or name in editmode_tests:
                  if data.get("includePlatforms") != ["Editor"]:
                      errors.append(f"editor-platforms:{name}")
              elif data.get("includePlatforms") not in (None, []):
                  errors.append(f"unexpected-platforms:{name}")

          # Azyklizitaet des internen Produktionsgraphen
          edges = {name: expected[name] for name in expected if name in found}
          visiting, visited = set(), set()
          def visit(node):
              if node in visited:
                  return False
              if node in visiting:
                  return True
              visiting.add(node)
              cycle = any(visit(target) for target in edges.get(node, set()) if target in edges)
              visiting.discard(node)
              visited.add(node)
              return cycle
          if any(visit(node) for node in sorted(edges)):
              errors.append("assembly-cycle")

          # Keine Assembly darf eine Testassembly referenzieren (Tests sind Blaetter).
          for name, (path, data) in sorted(found.items()):
              if any(ref in test_expected for ref in data.get("references", [])):
                  errors.append(f"test-assembly-referenced:{name}")

          # Skelett-Konventionen: Nullable und Warnungen-als-Fehler pro Assembly.
          for name, (path, data) in sorted(found.items()):
              rsp = path.parent / "csc.rsp"
              if not rsp.is_file():
                  errors.append(f"csc-rsp-missing:{name}")
              else:
                  content = rsp.read_text(encoding="utf-8")
                  if "-nullable:enable" not in content or "-warnaserror+" not in content:
                      errors.append(f"csc-rsp-content:{name}")
              meta = pathlib.Path(str(path) + ".meta")
              if not meta.is_file():
                  errors.append(f"asmdef-meta-missing:{name}")

          # Verbotene fachliche Bereiche in WP-008-Skeletten (stichprobenartige Guardrails).
          banned_tokens = ("PlayerPrefs", "Resources.Load", "ServiceLocator")
          for cs in sorted(root.glob("Assets/**/*.cs")):
              text = cs.read_text(encoding="utf-8")
              for token in banned_tokens:
                  if token in text:
                      errors.append(f"banned-token:{cs}:{token}")

          if errors:
              for item in errors:
                  print(f"FAIL {item}")
              sys.exit(1)
          print(f"MODULGRAPH PASS: {len(expected)} Produktions- und {len(test_expected)} Testassemblies, Allowlists exakt, Graph azyklisch, noEngineReferences und Testkonfiguration korrekt.")
          PYEOF

  unity-config:
    name: unity-config
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Unity-Lizenz und Runner-Konfiguration prüfen
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_RUNNERS_READY: ${{ vars.UNITY_RUNNERS_READY }}
        run: |
          set -euo pipefail
          ready="false"
          if [ -n "${UNITY_LICENSE}" ] && [ "${UNITY_RUNNERS_READY}" = "true" ]; then
            ready="true"
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

  unity-evidence-guard:
    name: unity-evidence-guard
    needs: [project-preflight, unity-config]
    runs-on: ubuntu-24.04
    steps:
      - name: Wahrheitsgemäßer Unity-Nachweisstatus
        if: needs.unity-config.outputs.ready != 'true'
        run: |
          echo "NOT_EXECUTED/BLOCKED unity-compile: Unity-Lizenz (secret UNITY_LICENSE) oder reproduzierbarer Linux-Unity-Runner nicht konfiguriert."
          echo "NOT_EXECUTED/BLOCKED unity-editmode: Unity-Lizenz oder reproduzierbarer Linux-Unity-Runner nicht konfiguriert."
          echo "NOT_EXECUTED/BLOCKED bootstrap-playmode-smoke: Unity-Lizenz oder reproduzierbarer Linux-Unity-Runner nicht konfiguriert."
          echo "NOT_EXECUTED/BLOCKED android-development-il2cpp: Unity-Lizenz oder reproduzierbarer Android-Build-Runner nicht konfiguriert."
          echo "NOT_EXECUTED/BLOCKED ios-export-compile: macOS-Runner mit Xcode 26+ nicht konfiguriert."
          echo "WP-008 kann ohne diese Nachweise nicht abgeschlossen werden. Es wird kein erfolgreicher Unity-Nachweis vorgetaeuscht."
          exit 1
      - name: Unity-Nachweiskonfiguration vorhanden
        if: needs.unity-config.outputs.ready == 'true'
        run: echo "Unity-Lizenz und Runner sind konfiguriert; die Unity-Nachweisjobs dieses Workflows sind der verbindliche Nachweis."

  unity-environment-linux:
    name: unity-environment-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: unityci/editor:ubuntu-6000.3.23f1-base-3.2.2@sha256:11860df05150306934e2193cea6b08bde0cc2956756464d12243a9076f65476c
    steps:
      - name: Editor-Version und Headless-Start bis zur Lizenzprüfung prüfen
        run: |
          set -euo pipefail
          unity-editor -version
          PROBE_DIR=/tmp/stp-editor-probe
          mkdir -p "${PROBE_DIR}/Assets" "${PROBE_DIR}/ProjectSettings"
          set +e
          unity-editor -batchmode -nographics -projectPath "${PROBE_DIR}" -quit -logFile "${PROBE_DIR}/editor.log"
          code=$?
          set -e
          grep -i "licen" "${PROBE_DIR}/editor.log" | head -5
          test "${code}" -ne 0
          grep -qi "licen" "${PROBE_DIR}/editor.log"
          rm -rf "${PROBE_DIR}"
          echo "ENVIRONMENT PASS linux-base: Unity ${STP_UNITY_VERSION} startet headless und stoppt erwartungsgemäß an der Lizenzprüfung (Exitcode ${code})."

  unity-environment-android:
    name: unity-environment-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: unityci/editor:ubuntu-6000.3.23f1-android-3.2.2@sha256:4f19f96e06eb8bdd36051c8b9f92d8bf6ba3953e1e7286a1eecabaac21929a28
    steps:
      - name: Editor-Version und Headless-Start bis zur Lizenzprüfung prüfen
        run: |
          set -euo pipefail
          unity-editor -version
          PROBE_DIR=/tmp/stp-editor-probe
          mkdir -p "${PROBE_DIR}/Assets" "${PROBE_DIR}/ProjectSettings"
          set +e
          unity-editor -batchmode -nographics -projectPath "${PROBE_DIR}" -quit -logFile "${PROBE_DIR}/editor.log"
          code=$?
          set -e
          grep -i "licen" "${PROBE_DIR}/editor.log" | head -5
          test "${code}" -ne 0
          grep -qi "licen" "${PROBE_DIR}/editor.log"
          rm -rf "${PROBE_DIR}"
          echo "ENVIRONMENT PASS linux-android: Unity ${STP_UNITY_VERSION} startet headless und stoppt erwartungsgemäß an der Lizenzprüfung (Exitcode ${code})."

      - name: Android-Toolchain und IL2CPP im Container prüfen
        run: |
          set -euo pipefail
          AP=/opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer
          test -d "${AP}"
          test -d "${AP}/SDK"
          test -d "${AP}/NDK"
          test -d "${AP}/OpenJDK"
          test -f "${AP}/NDK/source.properties"
          grep "Pkg.Revision" "${AP}/NDK/source.properties"
          ls "${AP}/SDK/platforms"
          ls "${AP}/SDK/build-tools"
          test -d /opt/unity/Editor/Data/il2cpp
          echo "ENVIRONMENT PASS android-toolchain: SDK/NDK/OpenJDK und IL2CPP vorhanden."

  unity-environment-ios:
    name: unity-environment-ios
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Unity-Editor-Installation aus Cache wiederherstellen
        id: cache-unity
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/Unity/Hub/Editor/6000.3.23f1
          key: unity-editor-macos15-6000.3.23f1-ios-v1

      - name: Unity Hub installieren
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: brew install --cask unity-hub

      - name: Unity 6000.3.23f1 mit iOS-Modul installieren (Changeset-gepinnt)
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install \
            --version "${STP_UNITY_VERSION}" --changeset "${STP_UNITY_CHANGESET}" \
            --module ios --architecture arm64
          test -d "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app"

      - name: unity-editor verlinken und Version prüfen
        run: |
          set -euo pipefail
          sudo ln -sfn "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" /usr/local/bin/unity-editor
          unity-editor -version

      - name: Editor-Headless-Start bis zur Lizenzprüfung prüfen
        run: |
          set -euo pipefail
          PROBE_DIR="${RUNNER_TEMP}/stp-editor-probe"
          mkdir -p "${PROBE_DIR}/Assets" "${PROBE_DIR}/ProjectSettings"
          set +e
          unity-editor -batchmode -nographics -projectPath "${PROBE_DIR}" -quit -logFile "${PROBE_DIR}/editor.log"
          code=$?
          set -e
          grep -i "licen" "${PROBE_DIR}/editor.log" | head -5
          test "${code}" -ne 0
          grep -qi "licen" "${PROBE_DIR}/editor.log"
          rm -rf "${PROBE_DIR}"
          echo "ENVIRONMENT PASS macos-editor: Unity ${STP_UNITY_VERSION} startet headless und stoppt erwartungsgemäß an der Lizenzprüfung (Exitcode ${code})."

      - name: Xcode 26+ auswählen und iOS-SDK prüfen
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "ENVIRONMENT FAIL xcode: Kein Xcode 26+ auf dem macos-15-Runner gefunden."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          XC_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*$/\1/p')"
          test "${XC_MAJOR}" -ge 26
          xcodebuild -showsdks | grep "iphoneos"
          echo "ENVIRONMENT PASS xcode: ${XCODE_APP} (Major ${XC_MAJOR}) mit iOS-SDK ausgewählt."

  unity-compile-editmode:
    name: unity-compile-editmode
    needs: [project-preflight, unity-config]
    if: needs.unity-config.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: unityci/editor:ubuntu-6000.3.23f1-base-3.2.2@sha256:11860df05150306934e2193cea6b08bde0cc2956756464d12243a9076f65476c
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unity-Library aus Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-linux-6000.3.23f1-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-linux-6000.3.23f1-

      - name: Unity-Lizenz bereitstellen
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          printf '%s' "${UNITY_LICENSE}" > /tmp/unity-license.ulf
          chmod 600 /tmp/unity-license.ulf

      - name: Editorversion verifizieren und Projekt kompilieren
        run: |
          unity-editor -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -manualLicenseFile /tmp/unity-license.ulf \
            -executeMethod STP.Editor.Build.StpBuildEntrypoints.VerifyProjectVersion \
            -quit -logFile -
          unity-editor -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -runTests -testPlatform EditMode -testResults TestResults/editmode.xml \
            -logFile -

      - name: Unity-Lizenz entfernen
        if: always()
        run: rm -f /tmp/unity-license.ulf

      - name: Testergebnisse archivieren
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa2d68b232a9cfa0e3d4fba2b29c5ee8 # v7.0.0
        with:
          name: editmode-results
          path: TestResults/

  unity-playmode-bootstrap-smoke:
    name: unity-playmode-bootstrap-smoke
    needs: [project-preflight, unity-config]
    if: needs.unity-config.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: unityci/editor:ubuntu-6000.3.23f1-base-3.2.2@sha256:11860df05150306934e2193cea6b08bde0cc2956756464d12243a9076f65476c
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unity-Library aus Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-linux-6000.3.23f1-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-linux-6000.3.23f1-

      - name: Unity-Lizenz bereitstellen
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          printf '%s' "${UNITY_LICENSE}" > /tmp/unity-license.ulf
          chmod 600 /tmp/unity-license.ulf

      - name: BootstrapCompositionSmoke (PlayMode, QA-Szene)
        run: |
          unity-editor -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -manualLicenseFile /tmp/unity-license.ulf \
            -runTests -testPlatform PlayMode -testResults TestResults/playmode.xml \
            -logFile -

      - name: Unity-Lizenz entfernen
        if: always()
        run: rm -f /tmp/unity-license.ulf

      - name: Testergebnisse archivieren
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa2d68b232a9cfa0e3d4fba2b29c5ee8 # v7.0.0
        with:
          name: playmode-results
          path: TestResults/

  unity-android-development-il2cpp:
    name: unity-android-development-il2cpp
    needs: [project-preflight, unity-config]
    if: needs.unity-config.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: unityci/editor:ubuntu-6000.3.23f1-android-3.2.2@sha256:4f19f96e06eb8bdd36051c8b9f92d8bf6ba3953e1e7286a1eecabaac21929a28
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unity-Library aus Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-linux-android-6000.3.23f1-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-linux-android-6000.3.23f1-

      - name: Unity-Lizenz bereitstellen
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          printf '%s' "${UNITY_LICENSE}" > /tmp/unity-license.ulf
          chmod 600 /tmp/unity-license.ulf

      - name: Android-Development-IL2CPP-Build
        run: |
          unity-editor -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -manualLicenseFile /tmp/unity-license.ulf \
            -buildTarget android \
            -executeMethod STP.Editor.Build.StpBuildEntrypoints.BuildAndroidDevelopmentIl2Cpp \
            -quit -logFile -

      - name: Unity-Lizenz entfernen
        if: always()
        run: rm -f /tmp/unity-license.ulf

      - name: Android-Buildartefakt archivieren
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa2d68b232a9cfa0e3d4fba2b29c5ee8 # v7.0.0
        with:
          name: android-development-il2cpp
          path: Builds/Android/

  unity-ios-export:
    name: unity-ios-export
    needs: [project-preflight, unity-config]
    if: needs.unity-config.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unity-Editor-Installation aus Cache wiederherstellen
        id: cache-unity
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/Unity/Hub/Editor/6000.3.23f1
          key: unity-editor-macos15-6000.3.23f1-ios-v1

      - name: Unity Hub installieren
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: brew install --cask unity-hub

      - name: Unity 6000.3.23f1 mit iOS-Modul installieren (Changeset-gepinnt)
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install \
            --version "${STP_UNITY_VERSION}" --changeset "${STP_UNITY_CHANGESET}" \
            --module ios --architecture arm64
          test -d "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app"

      - name: unity-editor verlinken
        run: |
          set -euo pipefail
          sudo ln -sfn "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" /usr/local/bin/unity-editor
          unity-editor -version

      - name: Unity-Library aus Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-macos-6000.3.23f1-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-macos-6000.3.23f1-

      - name: Xcode 26+ auswählen und iOS-SDK prüfen
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${XCODE_APP}" ]; then
            echo "Kein Xcode 26+ auf dem macos-15-Runner gefunden."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          XC_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*$/\1/p')"
          test "${XC_MAJOR}" -ge 26

      - name: Unity-Lizenz bereitstellen
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          printf '%s' "${UNITY_LICENSE}" > /tmp/unity-license.ulf
          chmod 600 /tmp/unity-license.ulf

      - name: iOS-Xcodeprojekt exportieren und kompilieren
        run: |
          unity-editor -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -manualLicenseFile /tmp/unity-license.ulf \
            -buildTarget ios \
            -executeMethod STP.Editor.Build.StpBuildEntrypoints.ExportIosXcodeProjectIl2Cpp \
            -quit -logFile -
          xcodebuild -project Builds/iOS/Xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Unity-Lizenz entfernen
        if: always()
        run: rm -f /tmp/unity-license.ulf
