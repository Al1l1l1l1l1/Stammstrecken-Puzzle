      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unity-Editor-Installation aus Cache wiederherstellen
        id: cache-unity
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Applications/Unity/Hub/Editor/6000.3.23f1
          key: unity-editor-macos15-6000.3.23f1-ios-v1
          save-always: true

      - name: Unity Hub installieren
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: brew install --cask unity-hub

      - name: Unity 6000.3.23f1 mit iOS-Modul installieren (Changeset-gepinnt)
        if: steps.cache-unity.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install \
            --version "${STP_UNITY_VERSION}" --changeset "${STP_UNITY_CHANGESET}" \
            --module ios --architecture arm64
          test -d "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app"

      - name: Editor-Version prüfen (direkter Bundle-Pfad)
        run: |
          set -euo pipefail
          "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" -version

      - name: Unity-Library aus Cache wiederherstellen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-macos-6000.3.23f1-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-macos-6000.3.23f1-

      - name: Xcode 26+ auswählen und iOS-SDK prüfen
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | sed 's/\.app$//' \
            | awk -F'_' '{n=split($2,v,"."); printf "%d %d %d %s.app\n", v[1], (n>1?v[2]:0), (n>2?v[3]:0), $0}' \
            | sort -k1,1n -k2,2n -k3,3n | tail -n 1 | cut -d' ' -f4-)"
          XC_MAJOR="$(basename "${XCODE_APP}" | sed -n 's/^Xcode_\([0-9][0-9]*\)\..*$/\1/p')"
          if [ -z "${XC_MAJOR}" ] || [ "${XC_MAJOR}" -lt 26 ]; then
            echo "Kein Xcode 26+ auf dem macos-15-Runner gefunden (neuestes: ${XCODE_APP})."
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Unity-Personal-Lizenz aktivieren (Unity Licensing Client)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          LIC_CLIENT="/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/Helpers/UnityLicensingClient.app/Contents/MacOS/Unity.Licensing.Client"
          "${LIC_CLIENT}" --username "${UNITY_EMAIL}" --password "${UNITY_PASSWORD}" --activate-all --include-personal
          "${LIC_CLIENT}" --showEntitlements

      - name: iOS-Xcodeprojekt exportieren und kompilieren
        run: |
          "/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" \
            -batchmode -nographics -projectPath "${GITHUB_WORKSPACE}" \
            -buildTarget ios \
            -executeMethod STP.Editor.Build.StpBuildEntrypoints.ExportIosXcodeProjectIl2Cpp \
            -quit -logFile -
          xcodebuild -project Builds/iOS/Xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Unity-Personal-Seat freigeben (best effort)
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          LIC_CLIENT="/Applications/Unity/Hub/Editor/${STP_UNITY_VERSION}/Unity.app/Contents/Helpers/UnityLicensingClient.app/Contents/MacOS/Unity.Licensing.Client"
          "${LIC_CLIENT}" --username "${UNITY_EMAIL}" --password "${UNITY_PASSWORD}" --deactivate-all || true
